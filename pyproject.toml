[project]
name = "trading-bot"
version = "0.1.0"
description = "T212 automated paper-trading bot (R1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = ["frontend", "spec", "designs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]
exclude = ["frontend", "spec", "designs"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
